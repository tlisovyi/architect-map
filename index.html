<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architectural Projects Map</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
#map{width:100%;height:100%}
.mapboxgl-popup{max-width:360px!important}
.mapboxgl-popup-content{padding:0!important;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.16);font-family:Arial,sans-serif}
.project-popup{width:320px;background:#fff}
.project-popup-image{display:block;width:100%;height:190px;object-fit:cover;background:#f1f1f1}
.project-body{padding:16px 18px 17px}
.project-body h3{margin:0 0 14px;font-size:19px;line-height:1.25;font-weight:600;color:#222}
.project-row{display:flex;justify-content:space-between;gap:20px;padding:7px 0;border-top:1px solid #eee;font-size:14px;line-height:1.3}
.project-row span{color:#777}.project-row b{color:#222;font-weight:500;text-align:right}
.mapboxgl-popup-close-button{z-index:2;width:30px;height:30px;font-size:22px;line-height:28px;color:#222;background:rgba(255,255,255,.9);border-radius:50%;margin:8px}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<script>
mapboxgl.accessToken='pk.eyJ1IjoidGxpc292eWkiLCJhIjoiY210dzU1MzZoMDZqMTJ5cXkxMTZuaHBvdSJ9.Dt0jY7pbet5LPGLmuDTFBg';
const STYLE_URL='mapbox://styles/tlisovyi/cmtw7skow009401sggw8qhc4r';
const LAYER_ID='Cottages';

const map=new mapboxgl.Map({
  container:'map',
  style:STYLE_URL,
  center:[30.5273,50.4349],
  zoom:10.86,
  attributionControl:true
});

function escapeHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function getImageUrl(value){
  const url=String(value??'').trim();
  if(!url)return '';
  const match=url.match(/\/file\/d\/([^/]+)/);
  if(match)return 'https://drive.google.com/thumbnail?id='+match[1]+'&sz=w1200';
  return url;
}

function showProjectPopup(feature){
  const p=feature.properties||{};
  const name=p.Name||'Проект';
  const area=p.Area||'';
  const year=p.Year||'';
  const status=p.Status||'';
  const image=getImageUrl(p.Image||'');
  const imageHtml=image
    ? '<img class="project-popup-image" src="'+escapeHtml(image)+'" alt="" onerror="this.style.display=\'none\'">'
    : '';

  const html=`
    <div class="project-popup">
      ${imageHtml}
      <div class="project-body">
        <h3>${escapeHtml(name)}</h3>
        <div class="project-row"><span>Площа</span><b>${escapeHtml(area)}</b></div>
        <div class="project-row"><span>Рік</span><b>${escapeHtml(year)}</b></div>
        <div class="project-row"><span>Статус</span><b>${escapeHtml(status)}</b></div>
      </div>
    </div>`;

  new mapboxgl.Popup({offset:16,closeButton:true,closeOnClick:true})
    .setLngLat(feature.geometry.coordinates)
    .setHTML(html).addTo(map);
}

map.on('load',()=>{
  if(!map.getLayer(LAYER_ID))return;

  // Явне масштабування іконок залежно від zoom.
  map.setLayoutProperty(LAYER_ID,'icon-size',[
    'interpolate',['linear'],['zoom'],
    8,1.5,
    10,2.0,
    12,3.0,
    14,4.0,
    16,5.0,
    18,6.0
  ]);

  map.addInteraction('project-click',{
    type:'click',
    target:{layerId:LAYER_ID},
    handler:e=>{if(e.feature)showProjectPopup(e.feature);}
  });

  map.addInteraction('project-mouseenter',{
    type:'mouseenter',
    target:{layerId:LAYER_ID},
    handler:e=>{map.getCanvas().style.cursor='pointer';}
  });

  map.addInteraction('project-mouseleave',{
    type:'mouseleave',
    target:{layerId:LAYER_ID},
    handler:e=>{map.getCanvas().style.cursor='';}
  });
});
</script>
</body>
</html>
