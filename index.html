<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architectural Projects Map</title>

  <!-- Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Popup */
    .mapboxgl-popup {
      max-width: 360px !important;
    }

    .mapboxgl-popup-content {
      padding: 0 !important;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
      font-family: "Nunito", sans-serif;
    }

    .project-popup {
      width: 320px;
      background: #fff;
    }

    .project-popup-image {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f1f1f1;
    }

    .project-body {
      padding: 15px 18px 14px;
    }

    .project-body h3 {
      margin: 0 0 10px;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 600;
      color: #222;
    }

    .project-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      min-height: 28px;
      padding: 4px 0;
      border-top: 1px solid #eee;
      font-size: 14px;
      line-height: 1.2;
    }

    .project-row span {
      color: #777;
      font-weight: 400;
    }

    .project-row b {
      color: #222;
      font-weight: 500;
      text-align: right;
    }

    .mapboxgl-popup-close-button {
      z-index: 2;
      width: 30px;
      height: 30px;
      margin: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 22px;
      line-height: 28px;
    }
  
    /* Compact popup on phones: approximately 50% of the desktop dimensions */
    @media (max-width: 600px) {
      .mapboxgl-popup {
        max-width: 180px !important;
      }

      .mapboxgl-popup-content {
        border-radius: 5px;
      }

      .project-popup {
        width: 160px;
      }

      .project-popup-image {
        height: 95px;
      }

      .project-body {
        padding: 7.5px 9px 7px;
      }

      .project-body h3 {
        margin: 0 0 5px;
        font-size: 11.4px;
        line-height: 1.25;
      }

      .project-row {
        gap: 10px;
        min-height: 14px;
        padding: 2px 0;
        font-size: 8.4px;
        line-height: 1.2;
      }

      .mapboxgl-popup-close-button {
        width: 15px;
        height: 15px;
        margin: 4px;
        border-radius: 50%;
        font-size: 11px;
        line-height: 14px;
      }
    }

  </style>
</head>

<body>
  <div id="map"></div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

  <script>
    mapboxgl.accessToken =
      'pk.eyJ1IjoidGxpc292eWkiLCJhIjoiY210dzU1MzZoMDZqMTJ5cXkxMTZuaHBvdSJ9.Dt0jY7pbet5LPGLmuDTFBg';

    const STYLE_URL =
      'mapbox://styles/tlisovyi/cmtw7skow009401sggw8qhc4r';

    const LAYER_ID = 'Cottages';

    const map = new mapboxgl.Map({
      container: 'map',
      style: STYLE_URL,
      center: [30.5273, 50.4349],
      zoom: 10.86,
      attributionControl: true
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getImageUrl(value) {
      const url = String(value ?? '').trim();

      if (!url) return '';

      /*
       * New projects should contain a direct public image URL
       * in the Mapbox Image field.
       *
       * Old Google Drive links are temporarily supported too.
       */
      const driveMatch = url.match(/\/file\/d\/([^/]+)/);

      if (driveMatch) {
        return 'https://drive.google.com/thumbnail?id=' +
          driveMatch[1] +
          '&sz=w1200';
      }

      return url;
    }

    function showProjectPopup(feature) {
      const properties = feature.properties || {};

      const name = properties.Name || 'Проект';
      const area = properties.Area || '';
      const year = properties.Year || '';
      const status = properties.Status || '';
      const image = getImageUrl(properties.Image || '');

      let imageHtml = '';

      if (image) {
        imageHtml =
          '<img class="project-popup-image" src="' +
          escapeHtml(image) +
          '" alt="" onerror="this.style.display=\'none\'">';
      }

      const html = `
        <div class="project-popup">
          ${imageHtml}

          <div class="project-body">
            <h3>${escapeHtml(name)}</h3>

            <div class="project-row">
              <span>Площа</span>
              <b>${escapeHtml(area)}</b>
            </div>

            <div class="project-row">
              <span>Рік</span>
              <b>${escapeHtml(year)}</b>
            </div>

            <div class="project-row">
              <span>Статус</span>
              <b>${escapeHtml(status)}</b>
            </div>
          </div>
        </div>
      `;

      new mapboxgl.Popup({
        offset: 16,
        closeButton: true,
        closeOnClick: true
      })
        .setLngLat(feature.geometry.coordinates)
        .setHTML(html)
        .addTo(map);
    }

    map.on('load', () => {
      /*
       * IMPORTANT:
       * Icon size is NOT changed here.
       * The size remains controlled by the Mapbox Studio style.
       */

      map.addInteraction('project-click', {
        type: 'click',
        target: { layerId: LAYER_ID },
        handler: (e) => {
          if (e.feature) {
            showProjectPopup(e.feature);
          }
        }
      });

      map.addInteraction('project-mouseenter', {
        type: 'mouseenter',
        target: { layerId: LAYER_ID },
        handler: () => {
          map.getCanvas().style.cursor = 'pointer';
        }
      });

      map.addInteraction('project-mouseleave', {
        type: 'mouseleave',
        target: { layerId: LAYER_ID },
        handler: () => {
          map.getCanvas().style.cursor = '';
        }
      });
    });
  </script>
</body>
</html>
